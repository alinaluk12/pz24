<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Инженерный дашборд</title>
    <style>
        body { background: #eaeef5; font-family: Arial, sans-serif; padding: 20px; }
        .box { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #134087; }
        label { display: block; margin-bottom: 15px; font-weight: bold; color: #414065; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #134087; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0d2b57; }
        .message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Модуль 1. Потребность в щебне</h2>
    <p>Формулы: V = L × B × h × K; M = V × ρ. Коэффициент K = 1,25.</p>
    <p style="font-size: 24px; color: #134087;"><b>100.00 м³</b></p>
    <p style="font-size: 24px; color: #134087;"><b>180.00 т</b></p>
</div>

<div class="box">
    <h2>Модуль 4: Учёт кирпичной кладки</h2>
    <form id="module4Form">
        <label>Дата <input type="date" name="Дата" required></label>
        <label>Участок <input type="text" name="Участок" required></label>
        <label>Объём, м³ <input type="number" name="Объём, м³" min="0.01" step="0.01" required></label>
        <label>Бригада <input type="text" name="Бригада" required></label>
        <button type="submit">Сохранить в таблицу</button>
        <p id="module4Message" class="message"></p>
    </form>
</div>

<script>
    // ВАША НОВАЯ ССЫЛКА
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTRrRMCUC1q0s8qTNfBo9hdri36nIeIatAq9DztbhW_7mDeBzGzFgpYEf1CCiAQRpmUA/exec';
    const MODULE_NAME = 'Вариант 7. Учёт кирпичной кладки';

    document.getElementById('module4Form').addEventListener('submit', async function (e) {
        e.preventDefault(); 
        
        const form = this;
        const msg = document.getElementById('module4Message');
        const btn = form.querySelector('button[type="submit"]');
        
        const fields = {};
        new FormData(form).forEach((value, key) => {
            fields[key] = String(value).trim();
        });

        for (const [name, value] of Object.entries(fields)) {
            if (!value) {
                msg.textContent = 'Заполните поле: ' + name;
                msg.style.color = '#a83a35';
                return;
            }
        }

        const dataToSend = { module: MODULE_NAME, fields: fields };
        
        btn.disabled = true;
        msg.textContent = 'Отправка...';
        msg.style.color = '#2468a0';

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(dataToSend)
            });
            msg.textContent = 'Запрос отправлен. Проверьте таблицу.';
            msg.style.color = '#267747';
            form.reset(); 
        } catch (err) {
            msg.textContent = 'Ошибка: ' + err.message;
            msg.style.color = '#a83a35';
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
